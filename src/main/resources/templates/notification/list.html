<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>알림</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">알림 목록</h2>

    <div class="list-group" id="notificationList">
        <div class="list-group-item d-flex justify-content-between align-items-center"
             th:each="notification : ${notifications}"
             th:classappend="${notification.read} ? 'list-group-item-light' : 'list-group-item-warning'">
            <div>
                <span th:text="${notification.message}"></span>
                <small class="text-muted ms-2" th:text="${notification.createdAt}"></small>
            </div>
            <form th:action="@{/notifications/{id}/read(id=${notification.id})}"
                  method="post" th:if="${!notification.read}">
                <button type="submit" class="btn btn-sm btn-outline-primary">읽음</button>
            </form>
        </div>
    </div>
</div>

<!-- SSE 연결 -->
<script th:inline="javascript">
    const eventSource = new EventSource('/notifications/subscribe');

    eventSource.addEventListener('notification', function(event) {
        const notification = JSON.parse(event.data);

        // 새 알림 추가
        const list = document.getElementById('notificationList');
        const item = document.createElement('div');
        item.className = 'list-group-item list-group-item-warning d-flex justify-content-between align-items-center';
        item.innerHTML = `
            <div>
                <span>${notification.message}</span>
            </div>
        `;
        list.prepend(item);
    });

    eventSource.onerror = function() {
        eventSource.close();
    };
</script>
</body>
</html>
