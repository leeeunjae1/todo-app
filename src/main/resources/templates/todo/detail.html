<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>투두 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <!-- 투두 정보 -->
    <div class="card mb-4">
        <div class="card-body">
            <h3 th:text="${todo.title}"></h3>
            <p th:text="${todo.content}"></p>
            <div class="row">
                <div class="col-md-3">
                    <small class="text-muted">담당자</small>
                    <p th:text="${todo.assignedTo}"></p>
                </div>
                <div class="col-md-3">
                    <small class="text-muted">우선순위</small>
                    <p th:text="${todo.priority}"></p>
                </div>
                <div class="col-md-3">
                    <small class="text-muted">상태</small>
                    <p th:text="${todo.status}"></p>
                </div>
                <div class="col-md-3">
                    <small class="text-muted">마감일</small>
                    <p th:text="${todo.dueDate}"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- 상태 변경 -->
    <div class="mb-4">
        <h5>상태 변경</h5>
        <form th:action="@{/teams/{teamId}/todos/{todoId}/status(teamId=${teamId}, todoId=${todo.id})}"
              method="post" class="d-flex gap-2">
            <select name="status" class="form-select w-auto">
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status}"></option>
            </select>
            <button type="submit" class="btn btn-primary">변경</button>
        </form>
    </div>

    <!-- 댓글 목록 -->
    <div class="mb-4">
        <h5>댓글</h5>
        <div class="mb-3" th:each="comment : ${comments}">
            <div class="card">
                <div class="card-body">
                    <p th:text="${comment.content}"></p>
                    <small class="text-muted" th:text="${comment.writer}"></small>
                </div>
            </div>
        </div>
    </div>

    <!-- 댓글 작성 -->
    <form th:action="@{/teams/{teamId}/todos/{todoId}/comments(teamId=${teamId}, todoId=${todo.id})}"
          method="post">
        <div class="input-group">
            <input type="text" name="content" class="form-control" placeholder="댓글 입력">
            <button type="submit" class="btn btn-outline-primary">작성</button>
        </div>
    </form>

    <!-- 투두 삭제 -->
    <form th:action="@{/teams/{teamId}/todos/{todoId}/delete(teamId=${teamId}, todoId=${todo.id})}"
          method="post" class="mt-3">
        <button type="submit" class="btn btn-danger">삭제</button>
        <a th:href="@{/teams/{teamId}/todos(teamId=${teamId})}"
           class="btn btn-outline-secondary ms-2">목록으로</a>
    </form>
</div>
</body>
</html>
