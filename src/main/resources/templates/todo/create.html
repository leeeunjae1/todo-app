<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>투두 생성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">투두 생성</h2>
    <form th:action="@{/teams/{teamId}/todos/new(teamId=${teamId})}"
          th:object="${todoRequest}" method="post">
        <div class="mb-3">
            <label>제목</label>
            <input type="text" th:field="*{title}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>내용</label>
            <textarea th:field="*{content}" class="form-control" rows="4"></textarea>
        </div>
        <div class="mb-3">
            <label>우선순위</label>
            <select th:field="*{priority}" class="form-select">
                <option th:each="priority : ${priorities}"
                        th:value="${priority}"
                        th:text="${priority}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label>마감일</label>
            <input type="datetime-local" th:field="*{dueDate}" class="form-control">
        </div>
        <div class="mb-3">
            <label>담당자</label>
            <select th:field="*{assignedToId}" class="form-select">
                <option value="">담당자 없음</option>
                <option th:each="member : ${members}"
                        th:value="${member.user.id}"
                        th:text="${member.user.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">생성</button>
        <a th:href="@{/teams/{teamId}/todos(teamId=${teamId})}"
           class="btn btn-outline-secondary ms-2">취소</a>
    </form>
</div>
</body>
</html>
