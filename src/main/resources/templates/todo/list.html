<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>투두 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>투두 목록</h2>
        <a th:href="@{/teams/{teamId}/todos/new(teamId=${teamId})}" class="btn btn-primary">투두 생성</a>
    </div>

    <table class="table table-hover">
        <thead>
        <tr>
            <th>제목</th>
            <th>담당자</th>
            <th>우선순위</th>
            <th>상태</th>
            <th>마감일</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="todo : ${todos}">
            <td th:text="${todo.title}"></td>
            <td th:text="${todo.assignedTo}"></td>
            <td th:text="${todo.priority}"></td>
            <td th:text="${todo.status}"></td>
            <td th:text="${todo.dueDate}"></td>
            <td>
                <a th:href="@{/teams/{teamId}/todos/{todoId}(teamId=${teamId}, todoId=${todo.id})}"
                   class="btn btn-sm btn-outline-primary">상세보기</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
