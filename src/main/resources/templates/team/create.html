<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팀 생성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-4">팀 생성</h2>
    <form th:action="@{/teams/new}" th:object="${teamRequest}" method="post">
        <div class="mb-3">
            <label>팀 이름</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>팀 설명</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">팀 생성</button>
        <a href="/teams" class="btn btn-outline-secondary ms-2">취소</a>
    </form>
</div>
</body>
</html>
