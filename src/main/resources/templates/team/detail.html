<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팀 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2 class="mb-2" th:text="${team.name}"></h2>
    <p class="text-muted" th:text="${team.description}"></p>

    <!-- 투두 목록 바로가기 -->
    <a th:href="@{/teams/{id}/todos(id=${team.id})}" class="btn btn-primary mb-4">투두 목록</a>

    <!-- 팀원 목록 -->
    <h4 class="mb-3">팀원 목록</h4>
    <ul class="list-group mb-4">
        <li class="list-group-item d-flex justify-content-between"
            th:each="member : ${members}">
            <span th:text="${member.user.name}"></span>
            <span class="badge bg-primary" th:text="${member.role}"></span>
        </li>
    </ul>

    <!-- 팀원 초대 -->
    <h4 class="mb-3">팀원 초대</h4>
    <form th:action="@{/teams/{id}/invite(id=${team.id})}" method="post">
        <div class="input-group">
            <input type="email" name="email" class="form-control" placeholder="초대할 이메일 입력">
            <button type="submit" class="btn btn-outline-primary">초대</button>
        </div>
    </form>
</div>
</body>
</html>
