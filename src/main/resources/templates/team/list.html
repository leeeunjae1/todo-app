<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>팀 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>내 팀 목록</h2>
        <a href="/teams/new" class="btn btn-primary">팀 생성</a>
    </div>

    <div class="row">
        <div class="col-md-4 mb-3" th:each="team : ${teams}">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${team.name}"></h5>
                    <p class="card-text" th:text="${team.description}"></p>
                    <a th:href="@{/teams/{id}(id=${team.id})}" class="btn btn-outline-primary">상세보기</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
